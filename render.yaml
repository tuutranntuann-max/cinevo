services:
  - type: web
    name: cinevo-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT run:app
    healthCheckPath: /api/health
    branch: render-deploy
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MANAGER_BOOTSTRAP_PASSWORD
        generateValue: true
      - key: ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: https://cinevo-web.onrender.com
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: web
    name: cinevo-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    branch: render-deploy
    envVars:
      - key: VITE_API_URL
        value: https://cinevo-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
